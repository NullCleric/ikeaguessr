<div class="overlay">

    <h2 class="title">{{ lang.t('welcomeTitle') }}</h2>
    <p class="intro">{{ lang.t('welcomeIntro') }}</p>
    <ul class="rules">
      <li>🖼️ {{ lang.t('ruleGuess') }}</li>
      <li>⏱️ {{ lang.t('ruleTimer') }}</li>

      {{ lang.t('startGame') }}
    </button>
  </div>
</div>
