<main class="app">
  <app-game-header />

  @if (game.state() === 'loading') {
    <p class="loading">{{ lang.t('loading') }}</p>
  } @else {
    <app-lives-display [lives]="game.lives()" [maxLives]="3" />

    @if (game.currentQuestion(); as q) {
      <app-furniture-image [src]="q.furniture.image" />

      <app-timer-bar
        [duration]="20"
        [resetKey]="q.furniture.id"
        [running]="isPlaying()"
        (expired)="game.timeout()"
      />

      <app-answer-grid
        [options]="q.options"
        [correctAnswer]="q.furniture.name"
        [selected]="game.selectedAnswer()"
        [answered]="hasAnswered()"
        (picked)="game.answer($event)"
      />

      @if (hasAnswered()) {
        <app-next-button (clicked)="game.nextQuestion()" />
      }
    }
  }

  @if (isGameOver()) {
    <app-game-over-dialog
      [score]="game.score()"
      (replay)="game.startGame()"
    />
  }
</main>
